openapi: 3.0.3
info:
  title: Go-Kart Giveaway API
  version: 1.0.0
  description: |
    OpenAPI documentation for the Go-Kart Giveaway backend.

servers:
  - url: http://localhost:4000/api
    description: Local API
  - url: https://api.example.com/api
    description: Production (replace with your real API hostname)
tags:
  - name: Authentication
  - name: Giveaways
  - name: Orders
  - name: Payments
  - name: Winners
  - name: Participants
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      description: Public registration. The backend always creates the account with role USER.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access and refresh tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenRefreshResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200': { description: Logout successful }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Authenticated user }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Authentication]
      summary: Update authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200': { description: User updated successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /giveaway:
    get:
      tags: [Giveaways]
      summary: List giveaways
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/GiveawayStatus' }
        - name: categoryId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Giveaways retrieved successfully }

  /giveaway/create:
    post:
      tags: [Giveaways]
      summary: Create giveaway
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiveawayCreateRequest'
      responses:
        '201': { description: Giveaway created successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /giveaway/upload:
    post:
      tags: [Giveaways]
      summary: Upload giveaway images
      description: Admin only. Multipart upload with up to 6 images.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 6
                  items:
                    type: string
                    format: binary
      responses:
        '200': { description: Images uploaded successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /giveaway/slug/{slug}:
    get:
      tags: [Giveaways]
      summary: Get giveaway by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Giveaway retrieved successfully }
        '404': { $ref: '#/components/responses/NotFound' }

  /giveaway/{id}/winner:
    get:
      tags: [Giveaways]
      summary: Get winners for a giveaway
      description: Returns an array; it may be empty before winners are selected.
      security: []
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      responses:
        '200': { description: Giveaway winners retrieved successfully }

  /giveaway/{id}:
    get:
      tags: [Giveaways]
      summary: Get giveaway by ID
      security: []
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      responses:
        '200': { description: Giveaway retrieved successfully }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Giveaways]
      summary: Update giveaway
      description: Admin only. Unknown fields are ignored by the hardened service.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiveawayUpdateRequest'
      responses:
        '200': { description: Giveaway updated successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Giveaways]
      summary: Delete giveaway
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      responses:
        '200': { description: Giveaway deleted successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders:
    post:
      tags: [Orders]
      summary: Create order
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201': { description: Order created and payment initialized }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Orders]
      summary: Get all orders
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Orders retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /orders/my-orders:
    get:
      tags: [Orders]
      summary: Get my orders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Orders retrieved successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order
      description: Users may retrieve only their own order; admins may retrieve any order.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Order retrieved successfully }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Orders]
      summary: Delete an order
      description: Authenticated user endpoint; backend applies ownership/admin checks.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Order deleted successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: OrderStatus enum from Prisma }
      responses:
        '200': { description: Order status updated successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/methods:
    get:
      tags: [Payments]
      summary: List active payment methods
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [CRYPTO, PAYMENT_APP]
      responses:
        '200': { description: Payment methods retrieved }

  /payments/admin/methods:
    get:
      tags: [Payments]
      summary: List all payment methods
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Payment methods retrieved }
    post:
      tags: [Payments]
      summary: Create payment method
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodRequest'
      responses:
        '201': { description: Payment method created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/admin/methods/{methodId}:
    patch:
      tags: [Payments]
      summary: Update payment method
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: methodId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodUpdateRequest'
      responses:
        '200': { description: Payment method updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/admin/review-queue:
    get:
      tags: [Payments]
      summary: List payments awaiting review
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Review queue retrieved }
        '403': { $ref: '#/components/responses/Forbidden' }

  /payments/admin/{paymentId}/review:
    patch:
      tags: [Payments]
      summary: Review payment
      description: Admin only. Status must be SUCCESS or FAILED.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [SUCCESS, FAILED]
      responses:
        '200': { description: Payment reviewed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Payment cannot be reviewed in its current state }

  /payments/orders/{orderId}/initialize:
    post:
      tags: [Payments]
      summary: Select payment method for an order
      description: Authenticated users may initialize payment only for their own pending order.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodId]
              properties:
                paymentMethodId: { type: string }
      responses:
        '201': { description: Payment method selected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Order/payment is not in a valid state }

  /payments/{paymentId}/proof:
    post:
      tags: [Payments]
      summary: Submit payment screenshot
      security: [{ bearerAuth: [] }]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [screenshot]
              properties:
                screenshot:
                  type: string
                  format: binary
      responses:
        '201': { description: Payment screenshot submitted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/{providerTransactionId}:
    get:
      tags: [Payments]
      summary: Get payment status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: providerTransactionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Payment retrieved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /winners:
    get:
      tags: [Winners]
      summary: Get recent public winners
      security: []
      responses:
        '200': { description: Recent winners retrieved }

  /winners/me:
    get:
      tags: [Winners]
      summary: Get my wins
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Your wins retrieved }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /winners/{winnerId}/claim:
    post:
      tags: [Winners]
      summary: Claim a prize
      description: Authenticated winner endpoint; backend determines whether the authenticated user owns the winner record.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: winnerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Prize claimed successfully }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Prize cannot be claimed in its current state }

  /participants/giveaways/{giveawayId}:
    get:
      tags: [Participants]
      summary: List participants for a giveaway
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: Participants retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /participants/giveaways/{giveawayId}/participants/{userId}:
    get:
      tags: [Participants]
      summary: Get one participant in a giveaway
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Participant retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Get admin dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings:
    get:
      tags: [Admin]
      summary: Get platform settings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      summary: Update platform settings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Settings updated successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: Users retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders:
    get:
      tags: [Admin]
      summary: List orders for admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Orders retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/giveaways/{giveawayId}/status:
    patch:
      tags: [Admin]
      summary: Change giveaway lifecycle status
      description: |
        Admin only. Use CLOSED to manually close a giveaway. This endpoint does not require
        winners to have been selected. Once WINNER_SELECTED, the hardened service prevents
        moving the giveaway back to another status.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/GiveawayStatus'
      responses:
        '200': { description: Giveaway status updated successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Invalid lifecycle transition }

  /admin/giveaways/{giveawayId}:
    patch:
      tags: [Admin]
      summary: Admin update giveaway
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiveawayUpdateRequest'
      responses:
        '200': { description: Giveaway updated successfully }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Admin]
      summary: Admin delete giveaway
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      responses:
        '200': { description: Giveaway deleted successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/giveaways/{id}/participants:
    get:
      tags: [Admin]
      summary: List giveaway participants from admin dashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: Participants retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/giveaways/{id}/tickets:
    get:
      tags: [Admin]
      summary: List giveaway tickets for winner selection
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: Tickets retrieved successfully }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/giveaways/{giveawayId}/winners:
    post:
      tags: [Admin]
      summary: Manually select multiple winners
      description: |
        Admin only. Submit any number of eligible ticket IDs. There is no winner ranking.
        The endpoint creates one winner record per selected ticket.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectWinnersRequest'
      responses:
        '200': { description: Winners selected successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Ticket or giveaway is not eligible for winner selection }

  /admin/giveaways/{giveawayId}/winner:
    post:
      tags: [Admin]
      summary: Manually select one winner
      description: Backward-compatible single-winner endpoint. Prefer the multiple-winner endpoint.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/GiveawayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketId]
              properties:
                ticketId: { type: string }
      responses:
        '200': { description: Winner selected successfully }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Ticket or giveaway is not eligible }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived JWT access token returned by /auth/login or /auth/refresh-token.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    GiveawayId:
      name: giveawayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, phone, password]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, format: password, minLength: 12 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
    TokenResponse:
      type: object
      properties:
        error: { type: boolean, example: false }
        status: { type: integer, example: 200 }
        message: { type: string, example: Login successful }
        data:
          type: object
          properties:
            user: { type: object, additionalProperties: true }
            token:
              $ref: '#/components/schemas/Tokens'
    TokenRefreshResponse:
      type: object
      properties:
        error: { type: boolean, example: false }
        status: { type: integer, example: 200 }
        message: { type: string, example: Token refreshed }
        data:
          $ref: '#/components/schemas/Tokens'
    Tokens:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    GiveawayStatus:
      type: string
      enum: [DRAFT, ACTIVE, CLOSED, WINNER_SELECTED]
    GiveawayCreateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        currency: { type: string }
        maximumEntries: { type: integer, minimum: 1 }
        maximumEntriesPerUser: { type: integer, minimum: 1 }
        minimumEntriesPerPurchase: { type: integer, minimum: 1 }
        entriesSold: { type: integer, minimum: 0 }
        featured: { type: boolean }
        status: { $ref: '#/components/schemas/GiveawayStatus' }
        categoryId: { type: string }
        slug: { type: string }
        entryPrice: { type: number, format: double, minimum: 0 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        prize:
          type: object
          additionalProperties: true
    GiveawayUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/GiveawayCreateRequest'
    CreateOrderRequest:
      type: object
      required: [giveawayId, quantity, paymentMethodId]
      properties:
        giveawayId: { type: string }
        quantity: { type: integer, minimum: 1 }
        paymentMethodId: { type: string }
        idempotencyKey: { type: string }
    PaymentMethodRequest:
      type: object
      required: [type, provider, name, details]
      properties:
        type:
          type: string
          enum: [CRYPTO, PAYMENT_APP]
        provider:
          type: string
          enum: [BITCOIN, ETHEREUM, PAYPAL, CASH_APP, VENMO, ZELLE, OTHER]
        name: { type: string }
        details: { type: string }
        network: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    PaymentMethodUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/PaymentMethodRequest'
      description: All fields are optional for PATCH.
    SelectWinnersRequest:
      type: object
      required: [ticketIds]
      properties:
        ticketIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string }
    ApiResponse:
      type: object
      properties:
        error: { type: boolean }
        status: { type: integer }
        message: { type: string }
        data: { nullable: true }
    Error:
      type: object
      properties:
        error: { type: boolean, example: true }
        status: { type: integer, example: 400 }
        message: { type: string }
        code: { type: string }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not authorized for this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
